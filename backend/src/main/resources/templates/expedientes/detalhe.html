<!doctype html><html lang="pt" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Detalhe')}"></head><body><div th:replace="~{fragments/layout :: nav}"></div><main class="container py-4"><div class="d-flex justify-content-between"><div><span class="eyebrow" th:text="${e.numero}"></span><h1 th:text="${e.assunto}"></h1><p class="text-secondary" th:text="${e.remetente}"></p></div><span class="badge text-bg-primary h-25" th:text="${e.estado}"></span></div><div class="row g-4 mt-2"><div class="col-lg-7"><div class="card p-4 mb-4"><h3>Dados</h3><dl class="row mt-3"><dt class="col-sm-4">Entrada</dt><dd class="col-sm-8" th:text="${e.dataEntrada}"></dd><dt class="col-sm-4">Sector actual</dt><dd class="col-sm-8" th:text="${e.sectorActual.nome}"></dd><dt class="col-sm-4">Confidencialidade</dt><dd class="col-sm-8" th:text="${e.confidencialidade}"></dd><dt class="col-sm-4">Prioridade</dt><dd class="col-sm-8" th:text="${e.prioridade}"></dd></dl></div><div class="card p-4"><h3>Linha de tramitação</h3><div th:each="t:${e.tramitacoes}" class="timeline-item"><b th:text="${t.sectorOrigem != null ? t.sectorOrigem.nome : 'Entrada'}"></b> → <b th:text="${t.sectorDestino.nome}"></b><span class="badge text-bg-light" th:text="${t.estado}"></span><div class="small text-secondary" th:text="${t.dataEnvio}"></div></div></div></div><div class="col-lg-5"><div class="card p-4 mb-3"><h3>Acções</h3><form method="post" th:action="@{'/expedientes/'+${e.id}+'/tramitar'}" class="mb-3"><label>Tramitar para</label><select name="sectorDestino" class="form-select mb-2"><option th:each="s:${sectores}" th:value="${s.id}" th:text="${s.nome}"></option></select><textarea name="observacao" class="form-control mb-2" placeholder="Observação"></textarea><button class="btn btn-outline-primary w-100">Encaminhar</button></form><form method="post" th:action="@{'/expedientes/'+${e.id}+'/receber'}" class="mb-3"><button class="btn btn-outline-success w-100">Registar recepção</button></form><form method="post" th:action="@{'/expedientes/'+${e.id}+'/despacho'}" class="mb-3"><textarea name="texto" class="form-control mb-2" placeholder="Texto do despacho" required></textarea><button class="btn btn-primary w-100">Emitir despacho</button></form><form method="post" th:action="@{'/expedientes/'+${e.id}+'/arquivar'}"><button class="btn btn-dark w-100">Arquivar</button></form></div><div class="card p-4"><h3>Despachos</h3><div th:each="d:${e.despachos}" class="border-bottom py-2"><b th:text="${d.utilizador.nome}"></b><div th:text="${d.texto}"></div></div></div></div></div></main></body></html>
