<!doctype html><html lang="pt" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Expedientes')}"></head><body><div th:replace="~{fragments/layout :: nav}"></div><main class="container py-4"><div class="d-flex justify-content-between align-items-center mb-4"><div><span class="eyebrow">PROCESSOS</span><h1>Expedientes</h1></div><a href="/expedientes/novo" class="btn btn-primary">+ Novo expediente</a></div><form class="row g-2 mb-3"><div class="col-md-8"><input class="form-control" name="q" th:value="${q}" placeholder="Pesquisar por número, assunto ou remetente"></div><div class="col-md-2"><button class="btn btn-outline-primary w-100">Pesquisar</button></div></form><div class="table-responsive card"><table class="table align-middle mb-0"><thead><tr><th>Número</th><th>Assunto</th><th>Sector</th><th>Prioridade</th><th>Estado</th><th></th></tr></thead><tbody><tr th:each="e:${expedientes}"><td><b th:text="${e.numero}"></b></td><td th:text="${e.assunto}"></td><td th:text="${e.sectorActual.nome}"></td><td th:text="${e.prioridade}"></td><td th:text="${e.estado}"></td><td><a class="btn btn-sm btn-outline-primary" th:href="@{'/expedientes/'+${e.id}}">Abrir</a></td></tr></tbody></table></div></main></body></html>
