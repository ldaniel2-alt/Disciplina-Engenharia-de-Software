<!doctype html><html lang="pt" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Novo expediente')}"></head><body><div th:replace="~{fragments/layout :: nav}"></div><main class="container py-4"><div class="form-shell"><span class="eyebrow">NOVO REGISTO</span><h1>Registar expediente</h1><form method="post" action="/expedientes" class="row g-3"><div class="col-md-6"><label>Assunto</label><input name="assunto" class="form-control" required></div><div class="col-md-6"><label>N.º do documento</label><input name="numeroDocumento" class="form-control"></div><div class="col-md-6"><label>Remetente</label><input name="remetente" class="form-control"></div><div class="col-md-3"><label>Data do documento</label><input type="date" name="dataDocumento" class="form-control"></div><div class="col-md-3"><label>Prioridade</label><select name="prioridade" class="form-select"><option>NORMAL</option><option>URGENTE</option><option>MUITO_URGENTE</option></select></div><div class="col-md-6"><label>Confidencialidade</label><select name="confidencialidade" class="form-select"><option>INTERNO</option><option>RESERVADO</option><option>CONFIDENCIAL</option></select></div><div class="col-12"><label>Observação</label><textarea name="observacao" class="form-control" rows="4"></textarea></div><div class="col-12"><button class="btn btn-primary">Registar expediente</button></div></form></div></main></body></html>
