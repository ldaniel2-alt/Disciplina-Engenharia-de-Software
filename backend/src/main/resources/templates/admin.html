<!doctype html><html lang="pt" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Administração')}"></head><body><div th:replace="~{fragments/layout :: nav}"></div><main class="container py-4"><span class="eyebrow">RBAC</span><h1>Administração</h1><div class="row g-4"><div class="col-lg-8"><div class="card p-4"><h3>Utilizadores</h3><div class="table-responsive"><table class="table"><tr><th>Nome</th><th>Utilizador</th><th>Sector</th><th>Perfis</th><th>Estado</th></tr><tr th:each="u:${utilizadores}"><td th:text="${u.nome}"></td><td th:text="${u.username}"></td><td th:text="${u.sector.nome}"></td><td><span th:each="p:${u.papeis}" class="badge text-bg-secondary me-1" th:text="${p.nome}"></span></td><td th:text="${u.activo ? 'Activo':'Inactivo'}"></td></tr></table></div><p class="small text-secondary">O CRUD completo de administração está disponível em <code>/api/admin/**</code>.</p></div></div><div class="col-lg-4"><div class="card p-4"><h3>Papéis</h3><div th:each="p:${papeis}" class="border-bottom py-2"><b th:text="${p.nome}"></b><div class="small text-secondary" th:text="${p.descricao}"></div></div></div><div class="card p-4 mt-3"><h3>Sectores</h3><div th:each="s:${sectores}" class="py-1" th:text="${s.nome}"></div></div></div></div></main></body></html>
