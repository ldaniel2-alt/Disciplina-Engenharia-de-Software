<!doctype html><html lang="pt" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Auditoria')}"></head><body><div th:replace="~{fragments/layout :: nav}"></div><main class="container py-4"><span class="eyebrow">SEGURANÇA</span><h1>Auditoria</h1><div class="card table-responsive"><table class="table mb-0"><thead><tr><th>Data</th><th>Utilizador</th><th>Acção</th><th>Entidade</th><th>Detalhes</th><th>IP</th></tr></thead><tbody><tr th:each="a:${auditorias}"><td th:text="${a.dataHora}"></td><td th:text="${a.utilizador != null ? a.utilizador.username : '-'}"></td><td th:text="${a.acao}"></td><td th:text="${a.entidade+' #'+a.entidadeId}"></td><td th:text="${a.detalhes}"></td><td th:text="${a.enderecoIp}"></td></tr></tbody></table></div></main></body></html>
